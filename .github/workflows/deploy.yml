# อัปเดตแอปอัตโนมัติ: แก้ไฟล์ใน GitHub แล้วกด Commit → หน้าแอปอัปเดตเอง ทุกเครื่องโหลดเวอร์ชันใหม่เองภายใน 5 นาที
name: อัปเดตแอปอัตโนมัติ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  pages:
    name: อัปเดตหน้าแอป (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: เตรียมหน้าแอป
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          sed -i "s/__VERSION__/${GITHUB_SHA}/" _site/index.html
          printf '{"v":"%s"}' "${GITHUB_SHA}" > _site/version.json
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            python3 -c "import os;p='_site/index.html';s=open(p).read().replace('__SUPABASE_URL__',os.environ['SUPABASE_URL']).replace('__SUPABASE_KEY__',os.environ['SUPABASE_KEY']);open(p,'w').write(s)"
          fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
