# สำรองข้อมูลอัตโนมัติ สัปดาห์ละ 2 ครั้ง (และช่วยให้ Supabase ฟรีไม่ถูกพักโปรเจกต์เพราะไม่มีคนใช้)
# ไฟล์สำรองดาวน์โหลดได้ที่แท็บ Actions → เลือกรอบล่าสุด → Artifacts (เก็บ 90 วัน เห็นเฉพาะเจ้าของ repo)
name: สำรองข้อมูล

on:
  schedule:
    - cron: '0 18 * * 0,3'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: ดึงข้อมูลทั้งหมด
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then echo "ยังไม่ได้ตั้ง SUPABASE_URL / SUPABASE_KEY — ข้าม"; exit 0; fi
          AUTH=""; case "$SUPABASE_KEY" in eyJ*) AUTH="Authorization: Bearer $SUPABASE_KEY";; esac
          curl -fsS "${SUPABASE_URL%/}/rest/v1/or_store?select=kind,id,data,updated_at&limit=100000" \
            -H "apikey: $SUPABASE_KEY" ${AUTH:+-H "$AUTH"} -o backup.json
          python3 -c "import json;d=json.load(open('backup.json'));print('สำรอง',len(d),'รายการ')"
      - uses: actions/upload-artifact@v4
        if: hashFiles('backup.json') != ''
        with:
          name: สำรองข้อมูล-${{ github.run_number }}
          path: backup.json
          retention-days: 90
