# อัปเดตทุกแพลตฟอร์มอัตโนมัติ: แก้ไฟล์ใน GitHub แล้วกด Commit → หน้าแอป + Apps Script อัปเดตเอง
name: อัปเดตแอปอัตโนมัติ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  apps-script:
    name: อัปเดต Apps Script (ตัวเก็บข้อมูล)
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: ตรวจว่าตั้งค่าครบไหม
        id: check
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "ยังไม่ได้ตั้ง CLASPRC_JSON / SCRIPT_ID / DEPLOYMENT_ID — ข้ามการอัปเดต Apps Script (อัปเดตหน้าแอปอย่างเดียว)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20

      - name: ส่งโค้ดขึ้น Apps Script และอัปเดตลิงก์เดิม
        if: steps.check.outputs.skip != 'true'
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json
          sed -i "s/__VERSION__/${GITHUB_SHA}/" apps-script/Code.gs
          clasp push --force
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "auto ${GITHUB_SHA::7}"

  pages:
    name: อัปเดตหน้าแอป (GitHub Pages)
    needs: apps-script
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: เตรียมหน้าแอป
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          sed -i "s/__VERSION__/${GITHUB_SHA}/" _site/index.html
          if [ "${{ needs.apps-script.result }}" != "success" ]; then
            echo "Apps Script ไม่ได้อัปเดตรอบนี้ — ปิดการเตือนเวอร์ชันไม่ตรง"
            sed -i "s/const APP_VERSION = '${GITHUB_SHA}'/const APP_VERSION = '__VERSION__'/" _site/index.html
          fi
          if [ -n "$API_URL" ]; then
            python3 -c "import sys,os;p='_site/index.html';s=open(p).read().replace('__API_URL__',os.environ['API_URL']);open(p,'w').write(s)"
          fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
