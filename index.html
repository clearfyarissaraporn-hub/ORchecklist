*{box-sizing:border-box}
body{margin:0;font-family:"ORThai","Sarabun",Tahoma,system-ui,sans-serif;background:#f5f4f0;color:#222;font-size:18px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 96px}
h1{font-size:21px;margin:4px 0 2px;font-weight:600}
h2{font-size:18px;margin:14px 0 6px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sync{font-size:12px;color:#777;text-align:right}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 10px}
button{font:inherit;border:1px solid #c9c7bf;background:#fff;border-radius:12px;padding:12px 14px;min-height:54px;cursor:pointer;color:#222}
button:disabled{opacity:.5}
button.pri{background:#2d6a4f;border-color:#2d6a4f;color:#fff;font-weight:600}
button.on{background:#e7f1fb;border-color:#378add;color:#0c447c;font-weight:600}
button.sm{min-height:44px;padding:8px 14px;font-size:16px}
button.x{color:#a32d2d;border-color:#e8b4b4}
button.danger{background:#a32d2d;color:#fff;border-color:#a32d2d}
button.big{width:100%;margin:4px 0 10px}
.nav button{padding:10px 2px 8px;font-size:17px;border:none;border-radius:12px;background:var(--t);color:var(--c);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:62px}
.nav button i{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.35}
.nav button.on{background:var(--c);color:#fff;font-weight:600}
.nav button.on i{background:#fff;opacity:1}
.nav [data-v=new]{--c:#2d6a4f;--t:#e3f1e8}
.nav [data-v=saved]{--c:#1f6fb2;--t:#e3eef8}
.nav [data-v=settings]{--c:#7a4fa3;--t:#efe7f6}
.guide ol{padding-left:20px;margin:6px 0}.guide li{margin:5px 0}.guide h2{margin:14px 0 4px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 12px}
.steps div{text-align:center;font-size:13px;padding:6px 2px;border-radius:8px;background:#e8e6df;color:#666}
.steps div.cur{background:#2d6a4f;color:#fff;font-weight:600}
.steps div.done{background:#cfe7d8;color:#1b4332}
.card{background:#fff;border:1px solid #dedcd4;border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:14px;color:#555;margin:8px 0 4px}
input[type=text],input[type=date],input[type=password],input[type=url],select,textarea{font:inherit;width:100%;padding:12px;border:1px solid #c9c7bf;border-radius:12px;background:#fff;min-height:52px}
.row{background:#fff;border:1px solid #dedcd4;border-radius:12px;padding:10px;margin-bottom:8px}
.nm{font-weight:600;margin-bottom:6px}
.nmrow{display:flex;gap:8px;align-items:center}
.nmin{flex:1}
.qin{width:84px!important}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.row button.or.on{background:#d8f3dc;border-color:#2d6a4f;color:#1b4332}
.row button.bw.on{background:#fff0d6;border-color:#ba7517;color:#633806}
.row input.from{margin-top:6px;min-height:40px!important;padding:6px 10px!important;font-size:15px;max-width:240px;display:block}
.sugs{margin:6px 0 2px;max-height:280px;overflow:auto}
button.sug{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;margin:4px 0;min-height:48px;padding:8px 12px;background:#f1efe8}
button.sug small{color:#2d6a4f;font-size:14px;white-space:nowrap}
.imeta{font-size:13px;color:#888;margin-top:2px}
.sheet.wide{max-width:640px}
.pv{max-height:52vh;overflow:auto;background:#d9d7cf;padding:8px;border-radius:10px;margin:8px 0}
.pv img{display:block;width:100%;height:auto;margin:0 auto 8px;box-shadow:0 1px 4px rgba(0,0,0,.25);background:#fff}
.pmb{display:grid;gap:8px}.pmb button{width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 8px;font-size:14px;color:#555}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fffffe;border-top:1px solid #dedcd4;padding:10px 12px;display:flex;gap:8px;justify-content:center}
.foot button{flex:1;max-width:340px;min-height:58px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{min-height:44px!important;padding:6px 12px!important;font-size:16px;border-radius:20px!important;background:#f1efe8}
.chip.on{background:#2d6a4f;color:#fff;border-color:#2d6a4f}
.cat{font-size:15px;color:#777;margin:12px 0 4px;font-weight:600}
button.case{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;margin-bottom:6px;min-height:58px}
button.case small{color:#2d6a4f;font-size:14px}
button.case.on{background:#d8f3dc;border-color:#2d6a4f;color:#1b4332;font-weight:600}
.more summary{cursor:pointer;color:#555;margin:12px 0 4px;font-size:16px}
.menu button{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px;border-left:6px solid #7a4fa3}
.menu button b{display:block;font-size:19px}.menu button span{color:#666;font-size:15px}
button.back{margin:0 0 10px;background:transparent}
.muted{color:#777;font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.warn{background:#fff0d6;color:#633806;border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.ok{background:#d8f3dc;color:#1b4332;border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.err{background:#fcebeb;color:#791f1f;border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px}
.pill.b{background:#fff0d6;color:#633806}.pill.g{background:#d8f3dc;color:#1b4332}
.filters{display:flex;gap:6px;margin-bottom:8px}.filters input,.filters select{flex:1}
#busy{position:fixed;top:0;left:0;right:0;height:3px;background:#2d6a4f;transform-origin:left;animation:ld 1s infinite;display:none}
@keyframes ld{0%{transform:scaleX(.1)}50%{transform:scaleX(.7)}100%{transform:scaleX(1);opacity:.3}}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal .sheet{background:#fffffe;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px 18px}
#modal .sheet h2{margin:0 0 6px}
#modal .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
#modal .seg button.or.on{background:#d8f3dc;border-color:#2d6a4f;color:#1b4332;font-weight:600}
#modal .seg button.bw.on{background:#fff0d6;border-color:#ba7517;color:#633806;font-weight:600}
#modal .mact{display:flex;gap:8px;margin-top:12px}#modal .mact button{flex:1}
#modal .added{background:#d8f3dc;color:#1b4332;border-radius:10px;padding:6px 10px;font-size:14px;margin:6px 0}
#print{display:none}
@media print{
  @page{size:A4;margin:0}
  #print img.pg{display:block;width:210mm;height:297mm;page-break-after:always}
  #print img.pg:last-child{page-break-after:auto}
  body{background:#fff;font-family:"ORThai","Sarabun",Tahoma,sans-serif;font-size:12pt;line-height:1.45;color:#000}
  #app,#busy{display:none!important}
  #print{display:block}
  #print h1{font-size:17pt;margin:0 0 2px}
  #print h2{font-size:14pt;margin:10px 0 4px}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{border:1px solid #444;padding:5px 7px;vertical-align:top;font-size:12pt}
  #print tr{page-break-inside:avoid}
  #print th{background:#e6e6e6}
  #print .c{text-align:center;width:62px}
  #print section{page-break-after:always}
  #print section:last-of-type{page-break-after:auto}
  #print .sg{margin-top:14px}
}
</style>

<script>
/* ===== การเชื่อมต่อ: ตั้งครั้งเดียวต่อเครื่อง หรือเปิดลิงก์ที่มี ?api=...&key=... ===== */
const LS = {
  get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
(function(){
  const q = new URLSearchParams(location.search);
  if(q.get('u') && q.get('k')){ LS.set('or_url', q.get('u')); LS.set('or_dbkey', q.get('k')); history.replaceState(null,'',location.pathname); }
})();
// ค่าด้านล่าง GitHub Actions ใส่ให้อัตโนมัติ (ไม่ต้องแก้เอง)
const APP_VERSION = '__VERSION__';
const DEFAULT_URL = '__SUPABASE_URL__'.indexOf('__') === 0 ? '' : '__SUPABASE_URL__';
const DEFAULT_KEY = '__SUPABASE_KEY__'.indexOf('__') === 0 ? '' : '__SUPABASE_KEY__';
let API = LS.get('or_url') || DEFAULT_URL, KEY = LS.get('or_dbkey') || DEFAULT_KEY;
let serverVersion = '';

/* ===== สถานะ ===== */
let S = {cases:[], doctors:[], staff:[], templates:{}, records:[]};

const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const thDate = s => { if(!s) return ''; const p = String(s).split('-'); return p.length === 3 ? p[2]+'/'+p[1]+'/'+(+p[0]+543) : s; };
const SUBV = ['settings','items','cases','people','backup','help','setup'];
const caseById = id => S.cases.find(c => c.id === id);
const clone = o => JSON.parse(JSON.stringify(o));

function say(t, type){ msg = t; msgType = type || 'ok'; }
function setBusy(b){ busy = b; $('#busy').style.display = b ? 'block' : 'none'; }

/* ===== คุยกับฐานข้อมูล (Supabase) ===== */
const nowTh = () => new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Bangkok', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).format(new Date());
const enc = encodeURIComponent;
async function uploadLocalToCloud(){
  const mine = lrows().filter(r => r.updated_at !== SEED_TS);
  for(let i = 0; i < mine.length; i += 200) await upsertRows(mine.slice(i, i + 200));
  return mine.length;
}
function friendlyErr(status, text){
  if(status === 401 || status === 403) return 'รหัส (key) ไม่ถูกต้อง หรือยังไม่ได้รัน setup.sql';
  if(status === 404) return 'ไม่พบตาราง or_store — ยังไม่ได้รัน setup.sql ใน Supabase';
  if(status >= 500) return 'ฐานข้อมูลไม่ตอบสนอง (' + status + ') — ถ้าไม่ได้ใช้นานเกิน 7 วัน ให้เข้า supabase.com กด Restore project';
  return 'ผิดพลาด ' + status + ' ' + String(text || '').slice(0, 120);
}
async function sb(method, path, body, prefer){
  const h = {'Content-Type': 'application/json', apikey: KEY};
  if(KEY.indexOf('eyJ') === 0) h.Authorization = 'Bearer ' + KEY;

function lrows(){
  try{ const j = JSON.parse(LS.get('or_local_v1') || 'null'); if(Array.isArray(j)) return j; }catch(e){}
  const r = SEED_CASES.map(c => ({kind: 'case', id: c.id, data: c, updated_at: SEED_TS}));
  LS.set('or_local_v1', JSON.stringify(r)); return r;
}
const lsave = r => LS.set('or_local_v1', JSON.stringify(r));
async function upsertRows(rows){
  const ts = new Date().toISOString();
  if(cloud()) return sb('POST', 'or_store?on_conflict=kind,id', rows.map(r => Object.assign({updated_at: ts}, r)), 'resolution=merge-duplicates,return=minimal');
  const all = lrows();
  rows.forEach(n => { n = Object.assign({updated_at: ts}, n); const k = all.findIndex(r => r.kind === n.kind && r.id === n.id); if(k >= 0) all[k] = n; else all.push(n); });
  lsave(all);
}
async function delRow(kind, id){
  if(cloud()) return sb('DELETE', 'or_store?kind=eq.' + enc(kind) + '&id=eq.' + enc(id), null, 'return=minimal');
  lsave(lrows().filter(r => !(r.kind === kind && r.id === id)));
}
const caseOrder = c => { const m = /^c(\d+)$/.exec(c.id); return m ? +m[1] : 1000 + (c._t || 0) / 1e12; };

async function loadAll(){
  const verP = fetch('version.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(j => (j && j.v) || '').catch(() => '');
  let base, recs;
  if(cloud()){
    [base, recs] = await Promise.all([
      sb('GET', 'or_store?select=kind,id,data,updated_at&kind=neq.record&limit=5000'),
      sb('GET', 'or_store?select=data&kind=eq.record&order=updated_at.desc&limit=300')
    ]);
  }else{
    const all = lrows(); base = all.filter(r => r.kind !== 'record');
    recs = all.filter(r => r.kind === 'record').sort((a, b) => (b.updated_at > a.updated_at ? 1 : -1)).slice(0, 300).map(r => ({data: r.data}));
  }
  const ver = await verP;
  const d = {cases: [], doctors: [], staff: [], templates: {}, items: [], records: recs.map(r => r.data), serverTime: nowTh(), version: ver};
  const dr = [], sr = [];
  base.forEach(r => {
    if(r.kind === 'case') d.cases.push(Object.assign({}, r.data, {_t: Date.parse(r.updated_at) || 0}));
    else if(r.kind === 'doctor') dr.push(r.data);
    else if(r.kind === 'staff') sr.push(r.data);
    else if(r.kind === 'template') d.templates[r.id] = r.data;
    else if(r.kind === 'item') d.items.push(r.data);
  });
  d.cases.sort((a, b) => caseOrder(a) - caseOrder(b)); d.cases.forEach(c => delete c._t);
  const byO = (a, b) => (a.o || 0) - (b.o || 0);
  d.doctors = dr.sort(byO).map(x => x.name); d.staff = sr.sort(byO).map(x => x.name);
  return d;
}

  const gone = current.filter(n => want.indexOf(n) < 0);
  await Promise.all(gone.map(n => delRow(kind, n)));
  if(want.length) await upsertRows(want.map((n, i) => ({kind, id: n, data: {name: n, o: i + 1}})));
}
const ACT = {
  async saveRecord(b){
    const r = b.record;
    if(!r || !r.caseId || !r.by) throw new Error('ข้อมูลไม่ครบ (เคส / ผู้ลงชื่อ)');
    const isEdit = !!r.id;
    r.id = r.id || ('r' + Date.now() + Math.floor(Math.random() * 1000));
    if(isEdit){ const old = S.records.find(x => x.id === r.id); r.savedAt = old ? old.savedAt : nowTh(); r.editedAt = nowTh(); }
    else { r.savedAt = nowTh(); r.editedAt = ''; }
    r.borrowIns = borrowText(r.ins); r.borrowSup = borrowText(r.sup); r.returned = r.returned || '';
    const rows = [{kind: 'record', id: r.id, data: r}];
    if(r.doctor){
      rows.push({kind: 'template', id: r.doctor + '|' + r.caseId, data: {key: r.doctor + '|' + r.caseId, doctor: r.doctor, caseId: r.caseId, caseName: r.caseName, ins: cleanList(r.ins), sup: cleanList(r.sup), updatedAt: nowTh()}});
      if(S.doctors.indexOf(r.doctor) < 0) rows.push({kind: 'doctor', id: r.doctor, data: {name: r.doctor, o: S.doctors.length + 1}});
    }
    rows.push.apply(rows, newItemRows('ins', (r.ins || []).map(x => ({n: x.n, or: x.s === 'O', from: x.from}))).concat(newItemRows('sup', (r.sup || []).map(x => ({n: x.n, or: x.s === 'O', from: x.from})))));
    await upsertRows(rows);
  },
  deleteRecord: b => delRow('record', b.id),
  async setReturned(b){
    const hit = S.records.find(x => x.id === b.id); if(!hit) throw new Error('ไม่พบใบนี้');
    const r = Object.assign({}, hit, {returned: b.returned ? nowTh() + (b.who ? ' (' + b.who + ')' : '') : ''});
    await upsertRows([{kind: 'record', id: r.id, data: r}]);
  },
  async saveCase(b){
    const c = b.case; if(!c || !c.name) throw new Error('ใส่ชื่อเคส');
    c.id = c.id || ('n' + Date.now()); c.cat = c.cat || 'เคสที่เพิ่มเอง';
    await upsertRows([{kind: 'case', id: c.id, data: c}].concat(newItemRows('ins', (c.ins || []).map(x => ({n: x[0], or: x[1] === 'O'}))), newItemRows('sup', (c.sup || []).map(x => ({n: x[0], or: String(x[2] || '').indexOf('O') >= 0})))));
  },
  deleteCase: b => delRow('case', b.id),
  async addDoctor(b){
    const n = String(b.name || '').trim();
    if(n && S.doctors.indexOf(n) < 0) await upsertRows([{kind: 'doctor', id: n, data: {name: n, o: S.doctors.length + 1}}]);
  },
  async savePeople(b){ await replaceNames('doctor', b.doctors || [], S.doctors); await replaceNames('staff', b.staff || [], S.staff); },
  deleteTemplate: b => delRow('template', b.key)
};
async function api(action, payload){
  setBusy(true);
  try{
    if(action){ const fn = ACT[action]; if(!fn) throw new Error('ไม่รู้จักคำสั่ง ' + action); await fn(payload || {}); }
    let d = await loadAll();
    if(!d.items.length && d.cases.length){ const rows = SEED_ITEMS.map(x => ({kind: 'item', id: itemId(x.t, x.n), data: x})); for(let i = 0; i < rows.length; i += 200) await upsertRows(rows.slice(i, i + 200)); d = await loadAll(); }
    applyData(d);
    return d;
  }finally{ setBusy(false); }
}
function applyData(d){
  S = {cases: d.cases || [], doctors: d.doctors || [], staff: d.staff || [], templates: d.templates || {}, items: d.items || [], records: d.records || []};
  loaded = true; lastSync = d.serverTime || ''; serverVersion = d.version || '';
  autoUpdate();
}
/* อัปเดตแอปอัตโนมัติ: ถ้าเซิร์ฟเวอร์เป็นเวอร์ชันใหม่ และไม่ได้กรอกใบค้างอยู่ จะโหลดแอปใหม่เอง (ลองครั้งเดียวต่อเวอร์ชัน) */
function autoUpdate(){
  if(!serverVersion || APP_VERSION.indexOf('__') === 0 || serverVersion.indexOf('__') === 0 || serverVersion === APP_VERSION) return;
  const busyForm = view === 'new' && step > 1;
  let tried = ''; try{ tried = sessionStorage.getItem('or_upd') || ''; }catch(e){}
  if(busyForm || tried === serverVersion) return;
  try{ sessionStorage.setItem('or_upd', serverVersion); }catch(e){}
  location.href = location.pathname + '?v=' + Date.now() + location.hash;
}
async function refresh(silent){
  try{ await api(); if(!silent) say('อัปเดตข้อมูลล่าสุดแล้ว'); }
  catch(e){ say('ดึงข้อมูลไม่ได้: ' + e.message + ' ', 'err'); }
  render();
}

function doPrint(r, parts){
  const mk = (title, list, isSup) => {

  };
  let h = '';
  if(parts.indexOf('ins') >= 0) h += mk('เครื่องมือ (Instrument)', r.ins, false);
  if(parts.indexOf('sup') >= 0) h += mk('เวชภัณฑ์', r.sup, true);
  $('#print').innerHTML = h;

}

/* ===== อ่านค่าจากฟอร์ม ===== */
function grab1(){
  const d = $('#docSel'), s = null, dt = $('#dateIn');
  if(dt) draft.date = dt.value;
  let ch = false;
  if(d && d.value !== draft.doctor){ draft.doctor = d.value; ch = true; }
  if(s && s.value !== draft.caseId){ draft.caseId = s.value; ch = true; }
  if(ch) loadCase();
}
function grab4(){
  const a = $('#byIn'), b = $('#by2In'), o = $('#okIn');
  if(a) draft.by = a.value.trim();
  if(b) draft.by2 = b.value.trim();
  if(o) draft.ok = o.checked;
}
const lines = id => $(id).value.split('\n').map(x => x.trim()).filter(Boolean);

async function run(fn){ try{ await fn(); }catch(e){ say(e.message, 'err'); } render(); }

/* ===== ปุ่มต่างๆ ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t || t.disabled) return;
  const a = t.dataset.act, k = t.dataset.k, i = +t.dataset.i;
  msg = '';
  if(a !== 'delrec' && a !== 'delcase') delPending = '';

  if(a === 'view'){ if(t.dataset.v === 'items') itemsEdit = null; view = t.dataset.v; justSaved = false; location.hash = view === 'new' ? '' : '#' + view; window.scrollTo(0, 0); render(); }
  else if(a === 'refresh'){ refresh(); }
  else if(a === 'itab'){ itemsTab = t.dataset.v; itemDel = ''; render(); }
  else if(a === 'additem'){ const v = normN($('#newItem').value); if(!v) return; const L = itemsEdit[itemsTab]; if(L.some(x => x.n.toLowerCase() === v.toLowerCase())){ say('มีชื่อนี้ในคลังแล้ว', 'err'); render(); return; } L.unshift({t: itemsTab, n: v, or: true, stock: '', grp: 'เพิ่มเอง', from: '', orig: ''}); itemQ = ''; render(); }
  else if(a === 'ior'){ const x = itemsEdit[itemsTab][+t.dataset.i]; x.or = !x.or; render(); }
  else if(a === 'idel'){ const L = itemsEdit[itemsTab], x = L[+t.dataset.i]; if(itemDel === x.id){ if(x.orig) itemsEdit.gone.push(x.orig); L.splice(+t.dataset.i, 1); itemDel = ''; } else itemDel = x.id; render(); }
  else if(a === 'itemsreset'){ startItems(); render(); }
  else if(a === 'saveitems'){ run(async () => { await saveItems(); await api(); startItems(); say('บันทึกคลังแล้ว ทุกเครื่องใช้รายการนี้ได้'); }); }
  else if(a === 'cat'){ const cs = catList(); catSel = t.dataset.v === '' ? '' : cs[+t.dataset.v]; if(draft && view === 'new') grab1(); render(); }
  else if(a === 'pickcase'){ grab1(); draft.caseId = t.dataset.id; loadCase(); render(); }
  else if(a === 'editpick'){ const c = caseById(t.dataset.id); editCase = c ? clone(c) : null; delPending = ''; render(); window.scrollTo(0, document.body.scrollHeight); }
  else if(a === 'reload'){ location.reload(); }
  else if(a === 'updateapp'){ location.href = location.pathname + '?v=' + Date.now() + location.hash; }
  else if(a === 'setup'){ view = 'setup'; render(); }
  else if(a === 'unlink'){ API = ''; KEY = ''; LS.set('or_url', ''); LS.set('or_dbkey', ''); loaded = false; run(async () => { await api(); say('กลับไปใช้แบบเครื่องเดียวแล้ว'); }); }
  else if(a === 'connect'){
    const u = ($('#apiIn').value.trim().match(/^https?:\/\/[^\/\s]+/) || [''])[0], k2 = $('#keyIn').value.trim().replace(/^Bearer\s+/i, '');
    const hadLocal = !cloud() && lrows().some(r => r.updated_at !== SEED_TS);
    API = u; KEY = k2; LS.set('or_url', API); LS.set('or_dbkey', KEY);
    view = 'backup'; loaded = false; render();
    run(async () => {
      if(!cloud()){ await api(); say('กลับไปใช้แบบเครื่องเดียวแล้ว'); return; }
      await api();
      if(hadLocal && confirm('ส่งข้อมูลที่ทำไว้ในเครื่องนี้ขึ้นระบบกลางด้วยไหม?')){ const n = await uploadLocalToCloud(); await api(); say('เชื่อมต่อแล้ว และส่งข้อมูล ' + n + ' รายการขึ้นระบบกลาง'); }
      else say('เชื่อมต่อระบบกลางแล้ว — ทุกเครื่องที่เปิดลิงก์เดียวกันเห็นข้อมูลร่วมกัน');
    });
  }
  else if(a === 'sharelink'){
    const link = location.origin + location.pathname + '?u=' + encodeURIComponent(API) + '&k=' + encodeURIComponent(KEY);
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => { say('คัดลอกลิงก์แล้ว ส่งให้น้องๆ เปิดครั้งเดียวเครื่องจะตั้งค่าเอง'); render(); }, () => { say('ลิงก์: ' + link); render(); });
  }

  /* ใบงาน */
  else if(a === 'set'){ const x = draft[k][i]; x.s = (x.s === t.dataset.v) ? '' : t.dataset.v; render(); }
  else if(a === 'allor'){ draft[k].forEach(x => { if(!x.s) x.s = 'O'; }); render(); }
  else if(a === 'delitem'){ draft[k].splice(i, 1); render(); }
  else if(a === 'openadd'){ openModal(k, t.dataset.t || 'd'); }
  else if(a === 'add'){
    const inp = $('#add_' + t.dataset.t + '_' + k); const n = inp.value.trim(); if(!n) return;
    if(t.dataset.t === 'd') draft[k].push(k === 'sup' ? {n, q:'', s:'', from:''} : {n, s:'', from:''});
    else editCase[k].push(k === 'sup' ? [n, '', ''] : [n, '']);
    render();
    const again = $('#add_' + t.dataset.t + '_' + k); if(again) again.focus();
  }
  else if(a === 'adddoc'){
    grab1(); const n = $('#newDoc').value.trim(); if(!n) return;
    run(async () => { await api('addDoctor', {name: n}); draft.doctor = n; if(draft.caseId) loadCase(); say('เพิ่มแพทย์ ' + n + ' แล้ว'); });
  }
  else if(a === 'addcase'){
    grab1(); const n = $('#newCase').value.trim(); if(!n) return;
    const id = 'n' + Date.now();
    run(async () => { await api('saveCase', {case: {id, cat: 'เคสที่เพิ่มเอง', name: n, ins: [], sup: []}}); draft.caseId = id; loadCase(); say('เพิ่มเคสแล้ว ใส่รายการในขั้นถัดไปได้เลย'); });

    step++; window.scrollTo(0, 0); render();
  }
  else if(a === 'back'){ if(step === 4) grab4(); step--; window.scrollTo(0, 0); render(); }
  else if(a === 'canceledit'){ newDraft(); render(); }
  else if(a === 'save'){
    grab4();

    if(!draft.ok){ say('ติ๊กยืนยันก่อนบันทึก', 'err'); render(); return; }
    const c = caseById(draft.caseId) || {};
    const rec = {id: draft.id, caseId: draft.caseId, caseName: c.name || '', doctor: draft.doctor, date: draft.date, by: draft.by, by2: draft.by2, ins: draft.ins, sup: draft.sup, returned: draft.returned};
    run(async () => {

      keep.doctor = draft.doctor; keep.date = draft.date; keep.by = draft.by;

      say('บันทึกแล้ว' + (rec.doctor ? ' — จำรายการของ ' + rec.doctor + ' ไว้ใช้ครั้งหน้า' : ''));
    });
  }
  else if(a === 'nextcase'){ newDraft(); view = 'new'; justSaved = false; location.hash = ''; render(); }

  /* ใบที่บันทึก */
  else if(a === 'printmenu'){ openPrintMenu(t.dataset.id); }

  else if(a === 'returned'){ run(async () => { await api('setReturned', {id: t.dataset.id, returned: !!t.dataset.v, who: keep.by}); say(t.dataset.v ? 'บันทึกว่าคืนครบแล้ว' : 'ยกเลิกสถานะคืนแล้ว'); }); }
  else if(a === 'editrec'){
    const r = S.records.find(x => x.id === t.dataset.id); if(!r) return;
    draft = {id: r.id, caseId: r.caseId, doctor: r.doctor || '', date: r.date, ins: clone(r.ins || []), sup: clone(r.sup || []), src: 'doctor', by: r.by, by2: r.by2 || '', ok: false, returned: r.returned || ''};
    step = 2; view = 'new'; justSaved = false; location.hash = ''; window.scrollTo(0, 0); render();
  }
  else if(a === 'delrec'){
    if(delPending !== t.dataset.id){ delPending = t.dataset.id; render(); return; }
    delPending = ''; run(async () => { await api('deleteRecord', {id: t.dataset.id}); say('ลบแล้ว'); });
  }

  /* แก้เคสมาตรฐาน */
  else if(a === 'addcase2'){
    const n = $('#newCase2').value.trim(); if(!n) return;
    editCase = {id: 'n' + Date.now(), cat: 'เคสที่เพิ่มเอง', name: n, ins: [], sup: []}; render();
  }
  else if(a === 'cdel'){ editCase[k].splice(i, 1); render(); }

const PART_LABEL = {prep: 'ใบเตรียมเคส (รวมทุกรายการ)', ins: 'เครื่องมือ', sup: 'เวชภัณฑ์', both: 'แยก 2 ใบ'};
async function renderPages(r, p){
  try{ await Promise.all([document.fonts.load('26px ORThai'), document.fonts.load('bold 26px ORThai')]); }catch(e){}

  const font = (px, b) => { g.font = (b ? 'bold ' : '') + px + 'px ' + FF; };
  const wrap = (txt, maxW) => { const out = []; String(txt || '').split('\n').forEach(par => { let line = ''; for(const ch of par){ if(g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; } else line += ch; } out.push(line); }); return out; };
  const box = (x, yy, s, on) => { g.lineWidth = 3; g.strokeRect(x, yy, s, s); if(on){ g.beginPath(); g.moveTo(x + 6, yy + s / 2); g.lineTo(x + s * 0.42, yy + s - 7); g.lineTo(x + s - 5, yy + 6); g.stroke(); } };
  const cols = [{n: 'รายการ', w: 560}, {n: 'มีใน OR', w: 105, c: 1}, {n: 'ต้องยืม', w: 105, c: 1}, {n: 'ยืมจาก', w: 210}, {n: 'คืนแล้ว', w: 100, c: 1}];
  const hdr = () => { let x = M; const hh = 56; g.fillStyle = '#e6e6e6'; g.fillRect(M, y, TW, hh); g.fillStyle = '#000'; g.lineWidth = 2; font(25, true);
    cols.forEach(c => { g.strokeRect(x, y, c.w, hh); const tw = g.measureText(c.n).width; g.fillText(c.n, c.c ? x + (c.w - tw) / 2 : x + 10, y + 13); x += c.w; }); y += hh; };
  const head = title => {
    font(40, true); wrap('ใบเช็กลิสต์ยืมของ ห้องผ่าตัด — ' + title, TW).forEach(l => { g.fillText(l, M, y); y += 56; }); y += 6;
    font(28, false); wrap('เคส: ' + r.caseName + (r.doctor ? '    แพทย์: ' + r.doctor : '') + '    วันที่ผ่าตัด: ' + thDate(r.date), TW).forEach(l => { g.fillText(l, M, y); y += 42; }); y += 10;
  };
  const table = (sub, list, isSup) => {
    if(y + 160 > H - M){ newPage(); }
    font(31, true); const nB = (list || []).filter(x => x.s === 'B').length;
    g.fillText(sub + '  (' + (list || []).length + ' รายการ' + (nB ? ' · ต้องยืม ' + nB : '') + ')', M, y); y += 50;
    hdr();
    if(!(list || []).length){ font(26, false); g.strokeRect(M, y, TW, 56); g.fillText('— ไม่มีรายการ —', M + 12, y + 14); y += 56; }
    (list || []).forEach(x => {
      font(26, false);
      const nameL = wrap(x.n + (isSup && x.q ? '  (' + x.q + ')' : ''), cols[0].w - 20), fromL = wrap(x.s === 'B' ? (x.from || '') : '', cols[3].w - 20);
      const rh = Math.max(nameL.length, fromL.length, 1) * 36 + 20;
      if(y + rh > H - M - 60){ newPage(); font(24, false); g.fillText(sub + ' (ต่อ)', M, y); y += 40; hdr(); font(26, false); }
      let xx = M; g.lineWidth = 2; cols.forEach(c => { g.strokeRect(xx, y, c.w, rh); xx += c.w; });
      nameL.forEach((l, i) => g.fillText(l, M + 10, y + 10 + i * 36));
      fromL.forEach((l, i) => g.fillText(l, M + cols[0].w + cols[1].w + cols[2].w + 10, y + 10 + i * 36));
      const bs = 32, cy = y + rh / 2 - bs / 2;
      box(M + cols[0].w + (cols[1].w - bs) / 2, cy, bs, x.s === 'O');
      box(M + cols[0].w + cols[1].w + (cols[2].w - bs) / 2, cy, bs, x.s === 'B');
      if(x.s === 'B') box(M + cols[0].w + cols[1].w + cols[2].w + cols[3].w + (cols[4].w - bs) / 2, cy, bs, !!r.returned);
      y += rh;
    });
    y += 26;
  };
  const sign = () => {
    font(27, false);
    const sg = 'ผู้ตรวจสอบ: ' + r.by + (r.by2 ? '    ผู้รับของ/ประสานยืม: ' + r.by2 : '') + '    บันทึกเมื่อ: ' + (r.savedAt || '') + (r.returned ? '    คืนครบ: ' + r.returned : '');
    const L = wrap(sg, TW); if(y + L.length * 40 + 20 > H - M){ newPage(); font(27, false); }
    L.forEach(l => { g.fillText(l, M, y); y += 40; });
  };
  if(p === 'prep'){ newPage(); head('ใบเตรียมเคสผ่าตัด'); table('เครื่องมือ (Instrument)', r.ins, false); table('เวชภัณฑ์', r.sup, true); sign(); }
  else{
    if(p === 'ins' || p === 'both'){ newPage(); head('เครื่องมือ (Instrument)'); table('เครื่องมือ (Instrument)', r.ins, false); sign(); }
    if(p === 'sup' || p === 'both'){ newPage(); head('เวชภัณฑ์'); table('เวชภัณฑ์', r.sup, true); sign(); }
  }
  pages.forEach((c, i) => { const gg = c.getContext('2d'); gg.font = '22px ' + FF; gg.fillStyle = '#555'; gg.textBaseline = 'top'; const t = 'หน้า ' + (i + 1) + '/' + pages.length; gg.fillText(t, W - M - gg.measureText(t).width, H - 50); });
  return pages;
}
const cvBytes = c => { const bin = atob(c.toDataURL('image/jpeg', 0.92).split(',')[1]), u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
function pagesToPdf(pages){
  const W = pages[0].width, H = pages[0].height, jpgs = pages.map(cvBytes);
  const enc8 = new TextEncoder(), chunks = []; let len = 0; const offs = [];
  const put = d => { const u = typeof d === 'string' ? enc8.encode(d) : d; chunks.push(u); len += u.length; };
  const n = jpgs.length; put('%PDF-1.4\n');
  const obj = (i, body) => { offs[i] = len; put(i + ' 0 obj\n'); put(body); put('\nendobj\n'); };
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Count ' + n + ' /Kids [' + jpgs.map((_, i) => (3 + i * 3) + ' 0 R').join(' ') + '] >>');
  jpgs.forEach((j, i) => {
    const pg = 3 + i * 3, ct = pg + 1, im = pg + 2, cs = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(pg, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>');
    obj(ct, '<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream');
    offs[im] = len; put(im + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + W + ' /Height ' + H + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + j.length + ' >>\nstream\n'); put(j); put('\nendstream\nendobj\n');
  });
  const total = 3 + n * 3, xr = len;
  put('xref\n0 ' + total + '\n0000000000 65535 f \n'); for(let i = 1; i < total; i++) put(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
  put('trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF');
  return new Blob(chunks, {type: 'application/pdf'});
}
async function makePdf(r, parts){ return pagesToPdf(await renderPages(r, parts.length === 2 ? 'both' : parts[0])); }

  if(m === 'part'){ pmod.p = t.dataset.v; drawPrintMenu(); return; }
  if(!r) return;
  const p = pmod.p, base = fileBase(r, p);
  (async () => {
    setBusy(true);
    try{
      const cv = await pmPages(r);
      if(m === 'print'){ printPages(cv); return; }
      let files;
      if(m === 'share') files = [new File([pagesToPdf(cv)], base + '.pdf', {type: 'application/pdf'})];
      else files = cv.map((c, i) => new File([cvBytes(c)], base + (cv.length > 1 ? '_หน้า' + (i + 1) : '') + '.jpg', {type: 'image/jpeg'}));
      const res = await shareOrSave(files, base);
      if(res === 'saved'){ say(m === 'share' ? 'บันทึกไฟล์ PDF แล้ว (โฟลเดอร์ดาวน์โหลด)' : 'บันทึกรูปภาพแล้ว ' + files.length + ' ไฟล์ (โฟลเดอร์ดาวน์โหลด)'); render(); }
    }catch(err){ say('ทำไม่สำเร็จ: ' + err.message, 'err'); render(); }
    finally{ setBusy(false); }
  })();
});

/* ===== คลังเครื่องมือ / เวชภัณฑ์ (ใช้ซ้ำได้ทุกเคส) ===== */
const normN = n => String(n || '').replace(/\s+/g, ' ').trim();
const itemId = (t, n) => t + '|' + normN(n).toLowerCase();
function catalog(t){
  const out = {}, add = (o, derived) => { const id = itemId(t, o.n); if(!normN(o.n) || out[id]) return; out[id] = Object.assign({t, n: normN(o.n), or: false, stock: '', grp: '', from: ''}, o, {n: normN(o.n), id, derived: !!derived}); };
  (S.items || []).filter(x => x.t === t).forEach(x => add(x, false));
  S.cases.forEach(c => (c[t] || []).forEach(x => add({n: x[0], or: String(t === 'sup' ? x[2] || '' : x[1] || '').indexOf('O') >= 0, grp: 'จากเคส'}, true)));
  return Object.values(out).sort((a, b) => a.n.localeCompare(b.n, 'th', {sensitivity: 'base'}));
}
function newItemRows(t, list){
  const have = {}; (S.items || []).forEach(x => have[itemId(x.t, x.n)] = 1);
  const rows = [];
  list.forEach(o => { const n = normN(o.n), id = itemId(t, n); if(!n || have[id]) return; have[id] = 1; rows.push({kind: 'item', id, data: {t, n, or: !!o.or, stock: '', grp: 'เพิ่มจากเคส', from: o.from || ''}}); });
  return rows;
}
function sugHtml(t, q){
  q = normN(q).toLowerCase();
  if(!q) return '<div class=muted style="font-size:15px">พิมพ์ 1–2 ตัวอักษร จะขึ้นรายการจากคลังให้แตะเลือก</div>';
  const L = catalog(t).filter(x => x.n.toLowerCase().indexOf(q) >= 0).slice(0, 8);
  if(!L.length) return '<div class=muted style="font-size:15px">ไม่มีในคลัง — กดเพิ่มได้เลย จะบันทึกเข้าคลังให้อัตโนมัติ</div>';
  return '<div class=muted style="font-size:14px">แตะเพื่อเพิ่มทันที</div>' + L.map(x => '<button class=sug data-m=pick data-v="' + esc(x.id) + '">' + esc(x.n) + '<small>' + (x.or ? 'มีใน OR' : 'ต้องยืม') + (x.stock ? ' · stock ' + esc(x.stock) : '') + '</small></button>').join('');
}
let itemsTab = 'ins', itemQ = '', itemsEdit = null, itemDel = '';
function startItems(){ itemsEdit = {ins: catalog('ins').map(x => Object.assign({}, x, {orig: x.derived ? '' : x.id})), sup: catalog('sup').map(x => Object.assign({}, x, {orig: x.derived ? '' : x.id})), gone: []}; }
function itemsView(){
  if(!itemsEdit) startItems();
  const L = itemsEdit[itemsTab], q = itemQ.trim().toLowerCase();
  let h = '<div class=card><div class=seg><button class="' + (itemsTab === 'ins' ? 'pri' : '') + '" data-act=itab data-v=ins>เครื่องมือ (' + itemsEdit.ins.length + ')</button><button class="' + (itemsTab === 'sup' ? 'pri' : '') + '" data-act=itab data-v=sup>เวชภัณฑ์ (' + itemsEdit.sup.length + ')</button></div>' +
    '<div class=muted style="font-size:15px;margin:6px 0">รายการทั้งหมดของ OR ใช้ซ้ำได้ทุกเคส ชื่อที่พิมพ์เพิ่มในเคสจะเข้าคลังเองเมื่อกดบันทึก</div>' +
    '<div class=nmrow><input type=text id=newItem placeholder="เพิ่มชื่อ' + (itemsTab === 'ins' ? 'เครื่องมือ' : 'เวชภัณฑ์') + 'ใหม่"><button class=pri data-act=additem>เพิ่ม</button></div>' +
    '<input type=text id=iq placeholder="ค้นหาในคลัง" value="' + esc(itemQ) + '" style="margin-top:8px"></div>';
  let n = 0;
  L.forEach((x, i) => {
    if(q && x.n.toLowerCase().indexOf(q) < 0) return; n++;
    h += '<div class=row><div class=nmrow><input type=text class=nmin value="' + esc(x.n) + '" data-in=iname data-i=' + i + '><button class="sm' + (x.or ? ' on' : '') + '" data-act=ior data-i=' + i + '>' + (x.or ? 'มีใน OR ✓' : 'ต้องยืม') + '</button><button class="sm x' + (itemDel === x.id ? ' danger' : '') + '" data-act=idel data-i=' + i + '>' + (itemDel === x.id ? 'ยืนยันลบ' : 'ลบ') + '</button></div>' +
      '<div class=imeta>' + (x.grp ? esc(x.grp) : '') + (x.stock ? ' · stock ' + esc(x.stock) : '') + '</div>' +
      (x.or ? '' : '<input type=text class=from placeholder="ยืมจากที่ไหน (ค่าเริ่มต้น)" value="' + esc(x.from) + '" data-in=ifrom data-i=' + i + '>') + '</div>';
  });
  if(!n) h += '<div class=muted>ไม่พบรายการ</div>';
  return h;
}
async function saveItems(){
  const rows = [];
  ['ins', 'sup'].forEach(t => itemsEdit[t].forEach(x => { const n = normN(x.n); if(!n) return; const id = itemId(t, n); if(x.orig && x.orig !== id) itemsEdit.gone.push(x.orig); rows.push({kind: 'item', id, data: {t, n, or: !!x.or, stock: x.stock || '', grp: x.grp === 'จากเคส' ? 'เพิ่มจากเคส' : (x.grp || ''), from: x.or ? '' : normN(x.from)}}); }));
  const keep = {}; rows.forEach(r => keep[r.id] = 1);
  for(const id of itemsEdit.gone) if(!keep[id]) await delRow('item', id);
  for(let i = 0; i < rows.length; i += 200) await upsertRows(rows.slice(i, i + 200));
}

render();
refresh(true);
</script>
