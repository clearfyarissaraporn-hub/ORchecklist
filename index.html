*{box-sizing:border-box}
body{margin:0;font-family:"Anuphan","ORThai","Sarabun",Tahoma,system-ui,sans-serif;background:#f5f4f0;color:#222;font-size:15px;line-height:1.5}
:root[data-font=mali] body,:root[data-font=mali] button,:root[data-font=mali] input,:root[data-font=mali] select{font-family:"Mali","ORThai","Sarabun",Tahoma,sans-serif}
:root[data-font=plain] body,:root[data-font=plain] button,:root[data-font=plain] input,:root[data-font=plain] select{font-family:"ORThai","Sarabun",Tahoma,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 96px}
h1{font-size:18px;margin:4px 0 2px;font-weight:600}
h2{font-size:16px;margin:12px 0 6px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sync{font-size:12px;color:#777;text-align:right}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 10px}
button{font:inherit;border:1px solid #c9c7bf;background:#fff;border-radius:11px;padding:9px 12px;min-height:44px;cursor:pointer;color:#222}
button:disabled{opacity:.5}
button.pri{background:#3a97a6;border-color:#3a97a6;color:#fff;font-weight:600}
button.on{background:#e7f1fb;border-color:#378add;color:#0c447c;font-weight:600}
button.sm{min-height:38px;padding:6px 12px;font-size:14px}
button.x{color:#a32d2d;border-color:#e8b4b4}
button.danger{background:#a32d2d;color:#fff;border-color:#a32d2d}
button.big{width:100%;margin:4px 0 10px}
.nav button{padding:7px 2px 6px;font-size:15px;border:none;border-radius:12px;background:var(--t);color:var(--c);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px}
.nav button i{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.35}
.nav button.on{background:var(--c);color:#fff;font-weight:600}
.nav button.on i{background:#fff;opacity:1}
.nav [data-v=new]{--c:#3a97a6;--t:#e9f6f8}
.nav [data-v=saved]{--c:#4f8fb5;--t:#e3eef8}
.nav [data-v=settings]{--c:#7a4fa3;--t:#efe7f6}
.guide ol{padding-left:20px;margin:6px 0}.guide li{margin:5px 0}.guide h2{margin:14px 0 4px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 12px}
.steps div{text-align:center;font-size:12.5px;padding:5px 2px;border-radius:8px;background:#e8e6df;color:#666}
.steps div.cur{background:#3a97a6;color:#fff;font-weight:600}
.steps div.done{background:#d3eef2;color:#2f6f7a}
.card{background:#fff;border:1px solid #dedcd4;border-radius:12px;padding:10px 12px;margin-bottom:8px}
label{display:block;font-size:13px;color:#555;margin:6px 0 3px}
input[type=text],input[type=date],input[type=password],input[type=url],input[type=email],select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid #c9c7bf;border-radius:10px;background:#fff;min-height:44px}
.row{background:#fff;border:1px solid #dedcd4;border-radius:10px;padding:8px 10px;margin-bottom:6px}
.nm{font-weight:600;margin-bottom:4px}
.nmrow{display:flex;gap:8px;align-items:center}
.nmin{flex:1}
.qin{width:84px!important}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.row button.or.on{background:#d3eef2;border-color:#3a97a6;color:#2f6f7a}
.row button.bw.on{background:#fff0d6;border-color:#ba7517;color:#633806}
.row input.from{margin-top:6px;min-height:40px!important;padding:6px 10px!important;font-size:15px;max-width:240px;display:block}
.sugs{margin:6px 0 2px;max-height:280px;overflow:auto}
button.sug{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;margin:4px 0;min-height:42px;padding:6px 12px;background:#f1efe8}
button.sug small{color:#3a97a6;font-size:14px;white-space:nowrap}
.isug{margin-top:4px}.isug:empty{display:none}
.imeta{font-size:13px;color:#888;margin-top:2px}
.sheet.wide{max-width:640px}
.sheet.wide{display:flex;flex-direction:column;height:92vh}.sheet.wide .pv{flex:1;min-height:0;max-height:none}.sheet.wide .pmb{grid-template-columns:1fr 1fr 1fr}.sheet.wide .pmb button,.sheet.wide .seg button{padding:8px 4px!important;font-size:15px!important;min-height:0!important}.sheet.wide .pmb,.sheet.wide .seg,.sheet.wide h2{flex:none}.pv{max-height:52vh;overflow:auto;background:#d9d7cf;padding:8px;border-radius:10px;margin:8px 0}
.pv img{display:block;width:100%;height:auto;margin:0 auto 8px;box-shadow:0 1px 4px rgba(0,0,0,.25);background:#fff}
.pmb{display:grid;gap:8px}.pmb button{width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 8px;font-size:14px;color:#555}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fffffe;border-top:1px solid #dedcd4;padding:8px 12px;display:flex;gap:8px;justify-content:center}
.foot button{flex:1;max-width:340px;min-height:48px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{min-height:36px!important;padding:4px 12px!important;font-size:14px;border-radius:20px!important;background:#f1efe8}
.chip.on{background:#3a97a6;color:#fff;border-color:#3a97a6}
.cat{font-size:13.5px;color:#777;margin:10px 0 4px;font-weight:600}
button.case{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;margin-bottom:5px;min-height:48px}
button.case small{color:#3a97a6;font-size:13px}
button.case.on{background:#d3eef2;border-color:#3a97a6;color:#2f6f7a;font-weight:600}
.more summary{cursor:pointer;color:#555;margin:10px 0 4px;font-size:14.5px}
.menu button{display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px;border-left:6px solid #7a4fa3}
.menu button b{display:block;font-size:16px}.menu button span{color:#666;font-size:13.5px}
button.back{margin:0 0 10px;background:transparent}
.muted{color:#777;font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.warn{background:#fff0d6;color:#633806;border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.ok{background:#d3eef2;color:#2f6f7a;border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.err{background:#fcebeb;color:#791f1f;border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12.5px;margin:0 3px 3px 0}.pill.r{background:#fcebeb;color:#8c1d18}.pill.gy{background:#eceae3;color:#666}
.pill.b{background:#fff0d6;color:#633806}.pill.g{background:#d3eef2;color:#2f6f7a}
.filters{display:flex;gap:6px;margin-bottom:8px}.filters input,.filters select{flex:1}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 8px}.seg2 button{font-weight:600}.seg2 button.r.on{background:#3a97a6;border-color:#3a97a6;color:#fff}.seg2 button.t.on{background:#4f8fb5;border-color:#4f8fb5;color:#fff}
.prog{height:8px;background:#e8e6df;border-radius:4px;overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:#3a97a6}
.ck{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #dedcd4;border-radius:10px;padding:6px 8px 6px 10px;margin-bottom:5px}.ck.cg{border-color:#b4e3ec}.ck.cb{border-color:#f0c9c5;background:#fffafa}
.ck .n{flex:1;min-width:0;font-size:14.5px;line-height:1.35}.ck .n small{display:block;color:#888;font-size:12px}
.ckb{display:flex;gap:5px;flex:none}.ckb button{min-height:38px;padding:4px 12px;font-size:14px;border-radius:9px}
.ckb button.y.on{background:#3a97a6;border-color:#3a97a6;color:#fff;font-weight:600}.ckb button.n{color:#b3261e;border-color:#e8b4b4}.ckb button.n.on{background:#b3261e;border-color:#b3261e;color:#fff;font-weight:600}
.why{display:flex;gap:5px;flex-wrap:wrap;margin:-1px 0 8px 10px}.why button{min-height:30px;padding:2px 10px;font-size:12.5px;border-radius:999px;background:#fdf3f2;border-color:#f0c9c5;color:#8c1d18}.why button.on{background:#b3261e;border-color:#b3261e;color:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.kpi{background:#fff;border:1px solid #dedcd4;border-radius:12px;padding:7px 12px}.kpi small{display:block;color:#777;font-size:12px}.kpi b{font-size:20px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;border-bottom:1px solid #d9d6cc}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;font-weight:600}.bars i{display:block;width:70%;border-radius:6px 6px 0 0;margin-top:2px}
.blab{display:flex;gap:8px;margin-top:4px}.blab span{flex:1;text-align:center;font-size:12px;color:#777}
.hb{margin-bottom:8px;font-size:13px}.hb .t{display:flex;justify-content:space-between;gap:8px}.hb .tr{height:8px;background:#eeece4;border-radius:4px;margin-top:3px}.hb .tr i{display:block;height:100%;border-radius:4px}
.mailpv{background:#faf9f5;border:1px dashed #cfcbbd;border-radius:10px;padding:8px 10px;font-size:13px;white-space:pre-wrap;margin:8px 0}
button.st{border-color:#7a4fa3;color:#5d3a85;font-weight:600}
/* ===== ธีมใหม่ ===== */
:root{--ink:#22231f;--y:#f2d35f;--ys:#d9b83f;--bg:#faf8f1;--ln:#efebdf;--sh:#ebe6d6}
body{background:var(--bg);color:var(--ink)}
.wrap{padding:14px 14px 170px}
h1{font-size:15px;color:#6b6a62;font-weight:600}
h2{font-weight:700}
button{border-color:#e2ddcc;border-radius:14px;box-shadow:0 2px 0 var(--sh)}
button.pri{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 3px 0 #0f100d}
button.sm{border-radius:12px}
.card{border-radius:20px;border-color:var(--ln);box-shadow:0 3px 0 var(--sh);padding:12px 14px}
.row{border-radius:16px;border-color:var(--ln);box-shadow:0 2px 0 var(--sh)}
input[type=text],input[type=date],input[type=password],input[type=url],input[type=email],select,textarea{border-color:#e2ddcc;border-radius:12px}
.chip{background:#fff;border-color:#e2ddcc}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.steps div{background:#efece2;border-radius:12px}.steps div.cur{background:var(--y);color:var(--ink);box-shadow:0 2px 0 var(--ys)}.steps div.done{background:#f7e7a1;color:#6b5400}
.menu button{border-left:6px solid var(--y)}
.foot{bottom:78px;background:transparent;border:0;padding:6px 12px}
.bnav{position:fixed;left:12px;right:12px;bottom:10px;max-width:696px;margin:0 auto;background:var(--ink);border-radius:22px;padding:6px;display:flex;gap:4px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.bnav button{flex:1;background:transparent;border:0;box-shadow:none;color:#d8d5c8;font-size:11.5px;min-height:52px;padding:6px 2px 5px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}.bnav button svg{flex:none}.ckb button{display:flex;align-items:center;justify-content:center}
.bnav button.on{background:var(--y);color:var(--ink);font-weight:700}
.hl{display:inline-block;background:var(--y);padding:0 10px;border-radius:10px;transform:rotate(-1.5deg);box-shadow:0 3px 0 var(--ys)}

function friendlyErr(status, text){
  if(status === 401 || status === 403) return 'รหัส (key) ไม่ถูกต้อง หรือยังไม่ได้รัน setup.sql';
  if(status === 404) return 'ไม่พบตาราง or_store — ยังไม่ได้รัน setup.sql ใน Supabase';
  if(status >= 500) return 'ฐานข้อมูลไม่ตอบสนอง (' + status + ') — ถ้าไม่ได้ใช้นานเกิน 7 วัน ให้เข้า supabase.com กด Restore project';
  return 'ผิดพลาด ' + status + ' ' + String(text || '').slice(0, 120);
}
async function sb(method, path, body, prefer){
  const h = {'Content-Type': 'application/json', apikey: KEY};
  if(KEY.indexOf('eyJ') === 0) h.Authorization = 'Bearer ' + KEY;
  if(prefer) h.Prefer = prefer;
  let res;
  try{ res = await fetch(API.replace(/^(https?:\/\/[^\/\s]+).*$/, '$1') + '/rest/v1/' + path, {method, headers: h, body: body ? JSON.stringify(body) : undefined}); }
  catch(e){ throw new Error('ต่อฐานข้อมูลไม่ได้ (ตรวจอินเทอร์เน็ต และลิงก์ Project URL)'); }
  const tx = await res.text();
  if(!res.ok) throw new Error(friendlyErr(res.status, tx));
  return tx ? JSON.parse(tx) : null;
}

async function api(action, payload){
  setBusy(true);

    if(action){ const fn = ACT[action]; if(!fn) throw new Error('ไม่รู้จักคำสั่ง ' + action); await fn(payload || {}); }
    let d = await loadAll();
    if(!d.items.length && d.cases.length){ const rows = SEED_ITEMS.map(x => ({kind: 'item', id: itemId(x.t, x.n), data: x})); for(let i = 0; i < rows.length; i += 200) await upsertRows(rows.slice(i, i + 200)); d = await loadAll(); }

  }finally{ setBusy(false); }
}

}

    '<div class=seg style="grid-template-columns:1fr 1fr 1fr">' + seg('prep') + seg('borrow') + seg('both') + seg('bins') + seg('bsup') + '</div>' +
    '<div id=pv class=pv><div class=muted>กำลังสร้างพรีวิว…</div></div>' +
    '<div class=pmb><button class="pri big" data-pm=share>แชร์ PDF</button><button class=big data-pm=img>บันทึกรูป</button><button class=big data-pm=print>ปริ้น</button></div>' +
    '<div class=muted style="margin-top:4px;font-size:13px">A4 · ปริ้น: เปิดใน Chrome → เลือกเครื่อง RICOH → A4 → พิมพ์</div>' +
    '<div class=mact><button data-pm=close>ปิด</button></div></div>';
  const want = pmod.p;
  pmPages(r).then(cv => { if(!pmod || pmod.p !== want) return; const P = $('#pv'); if(P) P.innerHTML = cv.map((c, i) => '<img alt="หน้า ' + (i + 1) + '" src="' + c.toDataURL('image/jpeg', 0.85) + '">').join(''); })
    .catch(e => { const P = $('#pv'); if(P) P.innerHTML = '<div class=err>สร้างพรีวิวไม่สำเร็จ: ' + esc(e.message) + '</div>'; });
}
function printPages(cv){
  pmod = null; drawPrintMenu();
  $('#print').innerHTML = cv.map(c => '<img class=pg src="' + c.toDataURL('image/jpeg', 0.92) + '">').join('');
  setTimeout(() => window.print(), 120);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-pm]'); if(!t){ if(pmod && e.target.id === 'modal'){ pmod = null; drawPrintMenu(); } return; }
  const m = t.dataset.pm; const r = pmod && S.records.find(x => x.id === pmod.id);
  if(m === 'close'){ pmod = null; drawPrintMenu(); return; }
  if(m === 'part'){ pmod.p = t.dataset.v; drawPrintMenu(); return; }
  if(!r) return;
  const p = pmod.p, base = fileBase(r, p);
  (async () => {
    setBusy(true);
    try{
      const cv = await pmPages(r);
      if(m === 'print'){ printPages(cv); return; }
      let files;
      if(m === 'share') files = [new File([pagesToPdf(cv)], base + '.pdf', {type: 'application/pdf'})];
      else files = cv.map((c, i) => new File([cvBytes(c)], base + (cv.length > 1 ? '_หน้า' + (i + 1) : '') + '.jpg', {type: 'image/jpeg'}));
      if(m === 'img'){ files.forEach(f => downloadBlob(f, f.name)); say('บันทึกรูปภาพแล้ว ' + files.length + ' ไฟล์ (ดูในแกลเลอรี/โฟลเดอร์ดาวน์โหลด)'); render(); return; }
      const res = await shareOrSave(files, base);
      if(res === 'saved'){ say(m === 'share' ? 'บันทึกไฟล์ PDF แล้ว (โฟลเดอร์ดาวน์โหลด)' : 'บันทึกรูปภาพแล้ว ' + files.length + ' ไฟล์ (โฟลเดอร์ดาวน์โหลด)'); render(); }
    }catch(err){ say('ทำไม่สำเร็จ: ' + err.message, 'err'); render(); }
    finally{ setBusy(false); }
  })();
});

/* ===== คลังเครื่องมือ / เวชภัณฑ์ (ใช้ซ้ำได้ทุกเคส) ===== */
const normN = n => String(n || '').replace(/\s+/g, ' ').trim();
const itemId = (t, n) => t + '|' + normN(n).toLowerCase();
function catalog(t){
  const out = {}, add = (o, derived) => { const id = itemId(t, o.n); if(!normN(o.n) || out[id]) return; out[id] = Object.assign({t, n: normN(o.n), or: false, stock: '', grp: '', from: ''}, o, {n: normN(o.n), id, derived: !!derived}); };
  (S.items || []).filter(x => x.t === t).forEach(x => add(x, false));
  S.cases.forEach(c => (c[t] || []).forEach(x => add({n: x[0], or: String(t === 'sup' ? x[2] || '' : x[1] || '').indexOf('O') >= 0, grp: 'จากเคส'}, true)));
  return Object.values(out).sort((a, b) => a.n.localeCompare(b.n, 'th', {sensitivity: 'base'}));
}
function newItemRows(t, list){
  const have = {}; (S.items || []).forEach(x => have[itemId(x.t, x.n)] = 1);
  const rows = [];
  list.forEach(o => { const n = normN(o.n), id = itemId(t, n); if(!n || have[id]) return; have[id] = 1; rows.push({kind: 'item', id, data: {t, n, or: !!o.or, stock: '', grp: 'เพิ่มจากเคส', from: o.from || ''}}); });
  return rows;
}
function sugHtml(t, q){
  if(mdl && mdl.picked && normN(q) === mdl.picked) return '<div class=added>เลือกแล้ว: ' + esc(mdl.picked) + ' — กด เพิ่ม ด้านล่าง หรือพิมพ์แก้ชื่อได้</div>';
  q = normN(q).toLowerCase();
  if(!q) return '<div class=muted style="font-size:15px">พิมพ์ 1–2 ตัวอักษร จะขึ้นรายการจากคลังให้แตะเลือก</div>';
  const L = catalog(t).filter(x => x.n.toLowerCase().indexOf(q) >= 0).slice(0, 8);
  if(!L.length) return '<div class=muted style="font-size:15px">ไม่มีในคลัง — กดเพิ่มได้เลย จะบันทึกเข้าคลังให้อัตโนมัติ</div>';
  return '<div class=muted style="font-size:14px">แตะชื่อเพื่อใส่ลงช่อง</div>' + L.map(x => '<button class=sug data-m=pick data-v="' + esc(x.id) + '">' + esc(x.n) + '<small>' + (x.or ? 'มีใน OR' : 'ต้องยืม') + (x.stock ? ' · stock ' + esc(x.stock) : '') + '</small></button>').join('');
}
let itemsTab = 'ins', itemQ = '', itemsEdit = null, itemDel = '';
function startItems(){ itemsEdit = {ins: catalog('ins').map(x => Object.assign({}, x, {orig: x.derived ? '' : x.id})), sup: catalog('sup').map(x => Object.assign({}, x, {orig: x.derived ? '' : x.id})), gone: []}; }
function itemsView(){
  if(!itemsEdit) startItems();
  const L = itemsEdit[itemsTab], q = itemQ.trim().toLowerCase();
  let h = '<div class=card><div class=seg><button class="' + (itemsTab === 'ins' ? 'pri' : '') + '" data-act=itab data-v=ins>เครื่องมือ (' + itemsEdit.ins.length + ')</button><button class="' + (itemsTab === 'sup' ? 'pri' : '') + '" data-act=itab data-v=sup>เวชภัณฑ์ (' + itemsEdit.sup.length + ')</button></div>' +
    '<div class=muted style="font-size:15px;margin:6px 0">รายการทั้งหมดของ OR ใช้ซ้ำได้ทุกเคส ชื่อที่พิมพ์เพิ่มในเคสจะเข้าคลังเองเมื่อกดบันทึก</div>' +
    '<button class="pri big" data-act=catadd style="width:100%">＋ เพิ่มของใหม่เข้าคลัง</button>' +
    '<input type=text id=iq placeholder="ค้นหาในคลัง" value="' + esc(itemQ) + '" style="margin-top:8px"></div>';
  let n = 0;
  L.forEach((x, i) => {
    if(q && (x.n + ' ' + (x.code || '')).toLowerCase().indexOf(q) < 0) return; n++;
    h += '<div class=row><div class=nmrow><input type=text class=nmin value="' + esc(x.n) + '" data-in=iname data-i=' + i + '><button class="sm' + (x.or ? ' on' : '') + '" data-act=ior data-i=' + i + '>' + (x.or ? 'มีใน OR ✓' : 'ต้องยืม') + '</button><button class="sm x' + (itemDel === x.id ? ' danger' : '') + '" data-act=idel data-i=' + i + '>' + (itemDel === x.id ? 'ยืนยันลบ' : 'ลบ') + '</button></div>' +
      '<div class=imeta>' + [x.code ? 'รหัส ' + esc(x.code) : '', x.grp ? esc(x.grp) : '', x.stock ? 'stock ' + esc(x.stock) : ''].filter(Boolean).join(' · ') + '</div>' +
      (x.or ? '' : '<input type=text class=from placeholder="ยืมจากที่ไหน (ค่าเริ่มต้น)" value="' + esc(x.from) + '" data-in=ifrom data-i=' + i + '>') + '</div>';
  });
  if(!n) h += '<div class=muted>ไม่พบรายการ</div>';
  return h;
}
async function saveItems(){
  const rows = [];
  ['ins', 'sup'].forEach(t => itemsEdit[t].forEach(x => { const n = normN(x.n); if(!n) return; const id = itemId(t, n); if(x.orig && x.orig !== id) itemsEdit.gone.push(x.orig); rows.push({kind: 'item', id, data: {t, n, code: x.code || '', or: !!x.or, stock: x.stock || '', grp: x.grp === 'จากเคส' ? 'เพิ่มจากเคส' : (x.grp || ''), from: x.or ? '' : normN(x.from)}}); }));
  const keep = {}; rows.forEach(r => keep[r.id] = 1);
  for(const id of itemsEdit.gone) if(!keep[id]) await delRow('item', id);
  for(let i = 0; i < rows.length; i += 200) await upsertRows(rows.slice(i, i + 200));
}

/* ===== แนะนำชื่อจากคลังใต้ช่องที่กำลังพิมพ์ (แตะแล้วใส่ลงช่องทันที) ===== */
function inlineSug(inp, t){
  const row = inp.closest('.row'); if(!row) return;
  let box = row.querySelector('.isug'); if(!box){ box = document.createElement('div'); box.className = 'isug'; row.appendChild(box); }
  const q = normN(inp.value).toLowerCase();
  const L = q ? catalog(t).filter(x => x.n.toLowerCase().indexOf(q) >= 0 && x.n.toLowerCase() !== q).slice(0, 6) : [];
  box.innerHTML = L.length ? '<div class=muted style="font-size:14px">แตะชื่อเพื่อใส่ลงช่อง</div>' + L.map(x => '<button class=sug data-isug="' + esc(x.id) + '" data-t=' + t + '>' + esc(x.n) + '<small>' + (x.or ? 'มีใน OR' : 'ต้องยืม') + '</small></button>').join('') : '';
}
function applyInlinePick(btn){
  const row = btn.closest('.row'), inp = row && row.querySelector('input.nmin'); if(!inp) return;
  const it = catalog(btn.dataset.t).find(x => x.id === btn.dataset.isug); if(!it) return;
  const k = inp.dataset.k, i = +inp.dataset.i;
  if(inp.dataset.in === 'nm'){ const x = draft[k][i]; x.n = it.n; x.s = it.or ? 'O' : 'B'; if(!it.or && it.from && !x.from) x.from = it.from; }
  else if(inp.dataset.in === 'cnm'){ const x = editCase[k][i]; x[0] = it.n; if(k === 'sup') x[2] = it.or ? 'O' : ''; else x[1] = it.or ? 'O' : ''; }
  render();
}
/* แตะรายการแนะนำ: ทำงานตอนนิ้วแตะ (ก่อนคีย์บอร์ดหุบ) จะได้กดโดนรายการที่เห็นจริง */
document.addEventListener('pointerdown', e => {
  const a = e.target.closest('[data-isug]');
  if(a){ e.preventDefault(); applyInlinePick(a); return; }
  const m = e.target.closest('[data-m=pick]');
  if(m && mdl){ e.preventDefault(); modalPick(m.dataset.v); }
}, true);
/* ใส่ชื่อที่เลือกลงช่องทันที (แก้ที่ช่องเดิม ไม่วาดป๊อปอัพใหม่ และกันคีย์บอร์ดเขียนทับตัวอักษรที่พิมพ์ค้างอยู่) */
let lastPick = 0;
function modalPick(id){
  const it = catalog(mdl.key).find(x => x.id === id); if(!it) return;
  mdlRead(); mdl.n = it.n; mdl.s = it.or ? 'O' : 'B'; mdl.from = it.from || ''; mdl.picked = it.n; lastPick = Date.now();
  drawModal();
  const i2 = $('#mN'); if(i2){ i2.value = it.n; }
}
document.addEventListener('click', e => { const m = e.target.closest('[data-m=pick]'); if(m && mdl && Date.now() - lastPick > 700) modalPick(m.dataset.v); }, true);

/* ===== ป๊อปอัพเพิ่มของใหม่เข้าคลัง (บันทึกทันที) ===== */
let cmod = null;
function openCatAdd(){ cmod = {t: itemsTab, n: '', code: '', stock: '', or: true, from: '', err: ''}; drawCatAdd(); setTimeout(() => { const i = $('#cN'); if(i) i.focus(); }, 30); }
function drawCatAdd(){
  const M = $('#modal'); if(!cmod){ M.className = ''; M.innerHTML = ''; return; }
  M.className = 'open';
  M.innerHTML = '<div class=sheet><h2>เพิ่มของใหม่เข้าคลัง</h2>' +
    '<div class=seg><button class="' + (cmod.t === 'ins' ? 'pri' : '') + '" data-cm=t data-v=ins>เครื่องมือ</button><button class="' + (cmod.t === 'sup' ? 'pri' : '') + '" data-cm=t data-v=sup>เวชภัณฑ์</button></div>' +
    (cmod.err ? '<div class=err>' + esc(cmod.err) + '</div>' : '') +
    '<label>ชื่อ</label><input type=text id=cN value="' + esc(cmod.n) + '" placeholder="' + (cmod.t === 'ins' ? 'เช่น Set General' : 'เช่น Vicryl 2-0') + '" autocomplete=off>' +
    '<div class=nmrow style="margin-top:6px"><input type=text id=cC value="' + esc(cmod.code) + '" placeholder="รหัส (ถ้ามี)"><input type=text id=cS value="' + esc(cmod.stock) + '" placeholder="Stock (ถ้ามี)" style="max-width:150px"></div>' +
    '<label>สถานะเริ่มต้น</label><div class=seg><button class="or' + (cmod.or ? ' on' : '') + '" data-cm=or data-v=1>มีใน OR</button><button class="bw' + (!cmod.or ? ' on' : '') + '" data-cm=or data-v=0>ต้องยืม</button></div>' +
    (!cmod.or ? '<input type=text class=from id=cF value="' + esc(cmod.from) + '" placeholder="ยืมจากที่ไหน (ถ้ารู้)" style="margin-top:6px">' : '') +
    '<div class=mact><button data-cm=close>ปิด</button><button class=pri data-cm=save>บันทึกเข้าคลัง</button></div></div>';
}
function cmRead(){ const g = id => { const e = $('#' + id); return e ? e.value : null; }; [['cN','n'],['cC','code'],['cS','stock'],['cF','from']].forEach(p => { const v = g(p[0]); if(v !== null) cmod[p[1]] = v; }); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-cm]'); if(!t) return;
  const m = t.dataset.cm; cmRead();
  if(m === 'close'){ cmod = null; drawCatAdd(); }
  else if(m === 't'){ cmod.t = t.dataset.v; drawCatAdd(); }
  else if(m === 'or'){ cmod.or = t.dataset.v === '1'; drawCatAdd(); }
  else if(m === 'save'){
    const n = normN(cmod.n); if(!n){ cmod.err = 'ใส่ชื่อก่อน'; drawCatAdd(); return; }
    const id = itemId(cmod.t, n);
    if(catalog(cmod.t).some(x => x.id === id)){ cmod.err = 'มีชื่อนี้ในคลังแล้ว'; drawCatAdd(); return; }
    const data = {t: cmod.t, n, code: normN(cmod.code), or: cmod.or, stock: normN(cmod.stock), grp: 'เพิ่มเอง', from: cmod.or ? '' : normN(cmod.from)};
    const tab = cmod.t; cmod = null; drawCatAdd();
    run(async () => { await upsertRows([{kind: 'item', id, data}]); if(itemsEdit) itemsEdit[tab].unshift(Object.assign({}, data, {id, orig: id})); await api(); itemsTab = tab; say('เพิ่ม "' + n + '" เข้าคลังแล้ว ใช้ได้ทุกเคสทันที'); });
  }
});

render();
refresh(true);
</script>
</body>
</html>
